name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Проверки DinD
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci-pip-cache
          key: pip-dind-${{ runner.arch }}-${{ hashFiles('requirements*.txt', '.github/ci/Dockerfile') }}
      - name: Запуск Docker-in-Docker
        run: bash .github/ci/dind.sh start
      - name: Подготовка тестовой БД и зависимостей
        run: |
          bash .github/ci/dind.sh database
          bash .github/ci/dind.sh exec make setup
      - name: Стиль и правила
        env:
          TESTS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$TESTS_BASE" || "$TESTS_BASE" == '0000000000000000000000000000000000000000' ]]; then
            TESTS_BASE=origin/develop
          fi
          bash .github/ci/dind.sh exec make rules tests-guard quality TESTS_BASE="$TESTS_BASE"
      - name: Безопасность кода
        run: bash .github/ci/dind.sh exec make sast secrets deps
      - name: Тесты
        run: bash .github/ci/dind.sh exec make test
      - name: Миграции
        run: bash .github/ci/dind.sh exec make migrations-check
      - name: Резервное копирование
        run: bash .github/ci/dind.sh exec make backup-check
      - name: Контейнерная проверка
        run: bash .github/ci/dind.sh exec make container-check
      - name: Доступ runner к отчётам и кэшу
        if: always()
        run: |
          if [[ -d .ci-pip-cache || -d reports ]]; then
            bash .github/ci/dind.sh exec bash -c 'for path in .ci-pip-cache reports; do
              if [[ -d "$path" ]]; then chmod -R a+rX "$path"; fi
            done'
          fi
      - name: Отчёты тестов и анализаторов
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-reports
          path: reports/
          if-no-files-found: ignore
      - name: Остановка Docker-in-Docker
        if: always()
        run: |
          if docker container inspect sklad-ci-dind >/dev/null 2>&1; then
            bash .github/ci/dind.sh stop
          fi

  build:
    name: Сборка и анализ образа
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Запуск Docker-in-Docker
        run: bash .github/ci/dind.sh start
      - name: Сборка и анализ в Trivy
        id: image
        run: |
          tag="sha-${GITHUB_SHA::7}"
          bash .github/ci/dind.sh exec make image-scan IMAGE_TAG="$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### Собран и проверен образ sklad:$tag (коммит $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Проверка локального registry
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: bash .github/ci/dind.sh registry "$TAG"
      - name: Отчёт анализа образа
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-reports
          path: reports/trivy.json
          if-no-files-found: ignore
      - name: Экспорт проверенного образа
        if: github.event_name == 'push'
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: bash .github/ci/dind.sh exec docker save "sklad:$TAG" | gzip -1 > sklad-image.tar.gz
      - name: Передать образ заданию публикации
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: sklad-image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Остановка Docker-in-Docker
        if: always()
        run: |
          if docker container inspect sklad-ci-dind >/dev/null 2>&1; then
            bash .github/ci/dind.sh stop
          fi

  publish:
    name: Публикация образа
    needs: [checks, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Публикация в GitHub Container Registry
        env:
          TAG: ${{ needs.build.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sklad"
          gunzip -c sklad-image.tar.gz | docker load
          printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          tags=("$TAG")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=("${GITHUB_REF_NAME#v}")
          fi
          for tag in "${tags[@]}"; do
            docker tag "sklad:$TAG" "$image:$tag"
            docker push "$image:$tag"
            echo "### Опубликован образ $image:$tag" >> "$GITHUB_STEP_SUMMARY"
          done
