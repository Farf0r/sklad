# CI «Склада»: те же команды, что make verify и make ci на ноутбуке, и публикация образа.
# Образ публикуется, только если прошли все проверки (needs у задания publish). Подробно — docs/ci.md.
name: CI

on:
  # отправка изменений в любую ветку и теги выпусков
  push:
    branches: ["**"]
    tags: ["v*"]
  # создание и обновление запроса на слияние в основные ветки
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# новый запуск для того же запроса на слияние отменяет устаревший
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  style:
    name: Стиль и правила
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          db-password: ${{ secrets.CI_DB_PASSWORD }}
          secret-key: ${{ secrets.CI_SECRET_KEY }}
      - name: make rules
        run: make rules
      - name: make quality
        run: make quality
      - name: Отчёт ruff
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: style-reports
          path: reports/
          if-no-files-found: ignore

  security:
    name: Безопасность кода
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          db-password: ${{ secrets.CI_DB_PASSWORD }}
          secret-key: ${{ secrets.CI_SECRET_KEY }}
      - name: make sast
        run: make sast
      - name: Отчёты анализаторов безопасности
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: reports/
          if-no-files-found: ignore

  tests:
    name: Тесты
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # отдельная тестовая база в контейнере, той же версии, что в compose.yaml
    services:
      postgres:
        image: postgres:17.11-trixie@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        env:
          POSTGRES_USER: sklad
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: sklad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sklad -d sklad_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          db-password: ${{ secrets.CI_DB_PASSWORD }}
          secret-key: ${{ secrets.CI_SECRET_KEY }}
          pg-client: "true"
      - name: make test
        run: make test
      - name: Итоги тестов в сводку
        if: always()
        run: |
          .venv/bin/python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path("reports/junit.xml")
          if report.exists():
              suite = ET.parse(report).getroot()
              suite = suite if suite.tag == "testsuite" else suite.find("testsuite")
              failed = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
              print(f"### Тесты: {suite.get('tests')}, упало: {failed}, пропущено: {suite.get('skipped')}")
          EOF
      - name: Отчёты тестов и покрытия
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

  migrations:
    name: Миграции
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-trixie@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        env:
          POSTGRES_USER: sklad
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: sklad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sklad -d sklad_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          db-password: ${{ secrets.CI_DB_PASSWORD }}
          secret-key: ${{ secrets.CI_SECRET_KEY }}
      - name: make migrations-check
        run: make migrations-check

  backup:
    name: Резервное копирование
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11-trixie@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        env:
          POSTGRES_USER: sklad
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: sklad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sklad -d sklad_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          db-password: ${{ secrets.CI_DB_PASSWORD }}
          secret-key: ${{ secrets.CI_SECRET_KEY }}
          pg-client: "true"
      - name: make backup-check
        run: make backup-check

  container:
    name: Контейнерная проверка
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
        with:
          db-password: ${{ secrets.CI_DB_PASSWORD }}
          secret-key: ${{ secrets.CI_SECRET_KEY }}
          postgres-password: ${{ secrets.CI_POSTGRES_PASSWORD }}
          sklad-db-password: ${{ secrets.CI_SKLAD_DB_PASSWORD }}
      - name: make container-check
        run: make container-check

  build:
    name: Сборка образа
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make image
        id: image
        run: |
          tag="sha-${GITHUB_SHA::7}"
          make image IMAGE_TAG="$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### Собран образ sklad:$tag (коммит $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
      # публикуется ровно тот образ, который собран и проверен здесь
      - name: Образ в файл для публикации
        if: github.event_name == 'push'
        run: docker save "sklad:${{ steps.image.outputs.tag }}" | gzip -1 > sklad-image.tar.gz
      - name: Передать образ заданию публикации
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: sklad-image.tar.gz
          retention-days: 1
          compression-level: 0

  publish:
    name: Публикация образа
    # публикация только после успеха ВСЕХ проверок: если хоть одна упала, задание пропускается
    needs: [style, security, tests, migrations, backup, container, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Публикация в GitHub Container Registry
        env:
          TAG: ${{ needs.build.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sklad"
          gunzip -c sklad-image.tar.gz | docker load
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=("$TAG")
          # для тега выпуска vX.Y.Z образ дополнительно получает тег X.Y.Z
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=("${GITHUB_REF_NAME#v}")
          fi
          for tag in "${tags[@]}"; do
            docker tag "sklad:$TAG" "$image:$tag"
            docker push "$image:$tag"
            echo "### Опубликован образ $image:$tag" >> "$GITHUB_STEP_SUMMARY"
          done
          docker logout ghcr.io
